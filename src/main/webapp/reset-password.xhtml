<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
    <title>PFE Manager - Nouveau mot de passe</title>
    <h:outputStylesheet name="css/style.css" />
</h:head>
<h:body>
    <div class="login-container">
        <div class="login-card">

            <h:graphicImage name="images/logo.png"
                            styleClass="logo" alt="Logo"/>
            <h2>Nouveau mot de passe</h2>

            <h:panelGroup rendered="#{not empty resetPasswordBean.messageErreur}">
                <div class="error-message">
                    <h:outputText value="#{resetPasswordBean.messageErreur}" />
                </div>
            </h:panelGroup>

            <h:panelGroup rendered="#{resetPasswordBean.tokenValide}">
                <h:form>
                    <!-- Token conservé dans un champ caché -->
                    <h:inputHidden value="#{resetPasswordBean.token}" />

                    <div class="input-group">
                        <label>Nouveau mot de passe</label>
                        <h:inputSecret value="#{resetPasswordBean.nouveauMotDePasse}"
                                       redisplay="true"
                                       styleClass="form-control"
                                       placeholder="Minimum 8 caractères" />
                    </div>

                    <div class="input-group">
                        <label>Confirmer le mot de passe</label>
                        <h:inputSecret value="#{resetPasswordBean.confirmerMotDePasse}"
                                       redisplay="true"
                                       styleClass="form-control" />
                    </div>

                    <h:commandButton value="Réinitialiser mon mot de passe"
                                     action="#{resetPasswordBean.reinitialiser}"
                                     styleClass="btn-primary" />
                </h:form>
            </h:panelGroup>

            <div class="footer-text" style="margin-top:15px; text-align:center;">
                <a href="login.xhtml">← Retour à la connexion</a>
            </div>

        </div>
    </div>
</h:body>
</html>
