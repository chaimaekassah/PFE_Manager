<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <title>PFE Manager – Dashboard</title>
    <h:outputStylesheet name="css/style.css"/>
    <h:outputStylesheet name="css/dashboard.css"/>
</h:head>
<h:body>
    <div class="app-layout">

        <ui:include src="/WEB-INF/templates/sidebar.xhtml">
            <ui:param name="rolePrefix" value="encadrant"/>
            <ui:param name="currentPage" value="dashboard"/>
        </ui:include>

        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">
                    Bienvenue, #{authBean.utilisateurConnecte.nom} !
                </h1>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📋</div>
                    <div class="stat-info">
                        <span class="stat-label">Mes Sujets</span>
                        <span class="stat-value">0</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👨‍🎓</div>
                    <div class="stat-info">
                        <span class="stat-label">Mes Étudiants</span>
                        <span class="stat-value">0</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div class="stat-info">
                        <span class="stat-label">PFE Validés</span>
                        <span class="stat-value">0</span>
                    </div>
                </div>
            </div>
        </main>

    </div>
</h:body>
</html>
