<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
    <title>PFE Manager - Mot de passe oublié</title>
    <h:outputStylesheet name="css/style.css" />
</h:head>
<h:body>
    <div class="login-container">
        <h:form>
            <div class="login-card">
                <h:graphicImage name="images/logo.png" styleClass="logo"/>
                <h2>Mot de passe oublié</h2>
                <p>Entrez votre email universitaire et nous vous enverrons un lien de réinitialisation.</p>

                <h:panelGroup rendered="#{not empty forgotPasswordBean.messageErreur}">
                    <div class="error-message">
                        <h:outputText value="#{forgotPasswordBean.messageErreur}" />
                    </div>
                </h:panelGroup>

                <h:panelGroup rendered="#{not empty forgotPasswordBean.messageSucces}">
                    <div class="success-message">
                        <h:outputText value="#{forgotPasswordBean.messageSucces}" />
                    </div>
                </h:panelGroup>

                <div class="input-group">
                    <h:outputLabel for="email" value="Adresse Email" />
                    <h:inputText id="email" value="#{forgotPasswordBean.email}"
                                 styleClass="form-control"
                                 placeholder="votre@email.com" />
                </div>

                <h:commandButton value="Envoyer le lien"
                                 action="#{forgotPasswordBean.envoyerLien}"
                                 styleClass="btn-primary" />

                <div class="footer-text">
                    <h:link value="Retour à la connexion" outcome="/login.xhtml" />
                </div>
            </div>
        </h:form>
    </div>
</h:body>
</html>
